<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drifters &amp; Co.</title>
<meta name="description" content="Drifters &amp; Co. is where unforgettable summer memories are made. Website and platform launching January 2027.">
<meta name="theme-color" content="#193b29">
<meta property="og:title" content="Drifters &amp; Co.">

<body>

<main id="top">

  <section class="scene opening" style="--hold:1.6" aria-label="Opening">
    <header class="masthead">
      <h1 class="wordmark"><img src="./media/wordmark-green.svg" width="720" height="708" alt="Drifters &amp; Co."></h1>
      <p class="masthead-line">Just a better summer</p>
    </header>
    <div class="stage">
      <img class="valley" src="./media/valley.webp" width="1000" height="655" alt="" fetchpriority="high" decoding="async">
      <div class="dim" aria-hidden="true"></div>
      <div class="frame" aria-hidden="false">
        <div class="frame-clip">
          <video data-video="hero" muted playsinline loop autoplay preload="auto" poster="./media/tape-hero.jpg" src="./media/tape-hero.mp4" width="720" height="1280" aria-label="Summer on tape: rafting, cliff jumps and friends"></video>
          <div class="rail rail-top" aria-hidden="true"></div>
          <div class="rail rail-bottom" aria-hidden="true"></div>
        </div>
      </div>
      <button type="button" class="play-fallback" hidden aria-label="Play video"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
    </div>
  </section>

  <section class="breath grainy" aria-label="Feelin Good Feels Good">
    <img class="tagline rise" src="./media/tagline.svg" width="720" height="512" alt="Feelin Good Feels Good" loading="lazy" decoding="async">
    <figure class="print rise" aria-label="A postcard">
      <div class="postcard">
        <img src="./media/roll/27-alpine-lake.webp" width="720" height="540" alt="A deep blue alpine lake below snow-patched granite peaks" loading="lazy" decoding="async">
      </div>
    </figure>
  </section>

  <section class="scene tapes" style="--hold:3.2" aria-label="Three tapes">
    <div class="stage">
      <div class="tape-layer is-on" style="--pos:50% 50%">
        <video data-video="tape-1" muted playsinline loop preload="none" poster="./media/tape-1.jpg" src="./media/tape-1.mp4" width="720" height="1280" aria-label="The crew cheering on the bus, the open road, an alpine lake"></video>
        <div class="dimmer" aria-hidden="true"></div>
        <button type="button" class="play-fallback" hidden aria-label="Play video"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
      </div>
      <div class="tape-layer" style="--pos:50% 40%">
        <video data-video="tape-2" muted playsinline loop preload="none" poster="./media/tape-2.jpg" src="./media/tape-2.mp4" width="720" height="960" aria-label="Jet boat on the lake, cliff jumping into a turquoise pool"></video>
        <div class="dimmer" aria-hidden="true"></div>
        <button type="button" class="play-fallback" hidden aria-label="Play video"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
      </div>
      <div class="tape-layer" style="--pos:50% 45%">
        <video data-video="tape-3" muted playsinline loop preload="none" poster="./media/tape-3.jpg" src="./media/tape-3.mp4" width="720" height="960" aria-label="A canyon road and a bungee jump from a forest bridge"></video>
        <div class="dimmer" aria-hidden="true"></div>
        <button type="button" class="play-fallback" hidden aria-label="Play video"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </section>

      </div>
    </div>
